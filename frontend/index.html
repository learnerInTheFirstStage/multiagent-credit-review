<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Credit Risk Review</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1rem; line-height: 1.5; }
      code { background: #eef1f5; padding: 0.1rem 0.3rem; border-radius: 3px; }
    </style>
  </head>
  <body>
    <h1>Credit Risk Review</h1>
    <p>Placeholder page. The React app replaces it (KAN-38).</p>
    <p>Services reachable through the gateway:</p>
    <ul id="status"></ul>
    <script>
      const list = document.getElementById("status");
      for (const name of ["auth", "orchestrator"]) {
        const item = document.createElement("li");
        item.textContent = name + ": checking";
        list.appendChild(item);
        fetch("/api/" + name + "/health")
          .then((res) => (res.ok ? res.json() : Promise.reject(new Error("HTTP " + res.status))))
          .then((body) => { item.textContent = name + ": " + body.status; })
          .catch((err) => { item.textContent = name + ": not reachable (" + err.message + ")"; });
      }
    </script>
  </body>
</html>
