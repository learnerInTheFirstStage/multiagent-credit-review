server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Vite writes hashed asset filenames (e.g. index-ABC123.js) so a new build
    # changes the names. The browser is never asked to load a stale one, which
    # makes a year-long immutable cache safe. The explicit =404 stops a missing
    # asset from falling through to index.html, which would otherwise return
    # HTML with Content-Type text/html and the browser would try to parse it
    # as JavaScript — the classic "Unexpected token <" after a deploy.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html is the SPA entry point. no-cache so the browser re-checks on
    # every visit: a deployed update is picked up on the next request instead
    # of being stuck in the cache.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Any other path (deep links like /cases/123) falls back to index.html so
    # React Router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
