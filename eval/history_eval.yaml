# The evaluation's earlier reviews: closed cases its customers' histories start from (spec 8.2).
#
# Same schema as eval/history.yaml, which holds the one review every stack has (seed_c_007_2025) and
# is the only file the image copies. This file is seeded by the evaluation only: the overlay mounts it
# and names both files in HISTORY_SEED_FILE. An id may be in one of the two files, never in both.
#
# Every review is dated before the data clock (2026-11-10), so it is an earlier review of every run.
#
#   seed_c_3xx, seed_c_107  the history of a case in eval/golden_set.yaml, which turns on it
#   seed_p1 to seed_p5      precedents for the search tool. Their customers (c_901 to c_905) are in no
#                           customer file and are no case. Each mirrors one case of a pair (c_002 and
#                           c_102, c_111 and c_110, and c_003), so copying the nearest one is wrong half
#                           the time. seed_p5's note is written as an instruction, as c_009's and c_203's
#                           memos are: it is test data.

schema_version: 1
reviews:
