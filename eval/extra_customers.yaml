# Customers the evaluation adds to the team's twelve. Same shape as
# data/shared_customers.yaml, which this file does not change. Written before
# any run, with the expected answers in eval/golden_set.yaml.
#
# Five kinds:
#   c_10x, c_11x  one fact changed from a team customer, which changes the answer
#   c_20x         something irrelevant, or a memo, added to a team customer, which must change nothing
#   c_30x, c_31x  a team customer with its ids renamed and nothing else changed. Only the earlier
#                 reviews in eval/history_eval.yaml differ, and they change the answer or must not
#   c_107         c_007's earlier review, with other facts today
#
# Two fields are used here that the team's file does not have:
#   bank_events[].to_account          the account a transfer went to
#   card_events[failed_repayment]     repaid_after_days, or still_unpaid

schema_version: 1
clock: {signal_date: "2026-11-10", signal_window_days: 7, trailing_window_weeks: 13}

customers:

  # c_002, but the $400K went to somebody else's account, never paid before.
  - id: c_102
    name: Lumen Analytics (twin)
    story: >
      $400K was paid to an account the company has never paid before. Everything else is as c_002.
    snapshot:
      bank:
        cash_now_cents: 48000000
        cash_week_ago_cents: 120000000
        linked_accounts: [{id: acct_c102_a, active: true, days_stale: 0}]
      card: {credit_limit_cents: 22000000, utilization_pct: 0.28, last_3_repayments: [paid, paid, paid]}
    signal_window:
      bank_events:
        - {category: vendor_new, amount_cents: 40000000, counterparty_kind: unknown_payee}
        - {category: payroll, amount_cents: 20000000, counterparty_kind: payroll_vendor}
        - {category: vendor_known, amount_cents: 12000000, counterparty_kind: known_vendor}
      card_events: []
    baselines:
      bank: {weekly_inflow_cents: 15000000, income_trend: steady}
      card: {funding_account_change: false, monthly_card_spend_cents: 6000000}

  # c_003 with the card trouble taken out: every repayment on time, 40% of the limit used
  # where c_003 uses 85%, half the monthly spend, and no rising trend.
  - id: c_103
    name: Harbor Freight Tech (milder)
    story: >
      Income has been shrinking for three months. The card is paid on time and lightly used.
    snapshot:
      bank:
        cash_now_cents: 30000000
        cash_week_ago_cents: 60000000
        linked_accounts: [{id: acct_c103_a, active: true, days_stale: 0}]
      card: {credit_limit_cents: 12500000, utilization_pct: 0.40, last_3_repayments: [paid, paid, paid]}
    signal_window:
      bank_events:
        - {category: income, amount_cents: 3000000, counterparty_kind: known_vendor}
      card_events: []
    baselines:
      bank: {weekly_inflow_cents: 3000000, weekly_inflow_3mo_ago_cents: 17000000, income_trend: shrinking}
      card: {funding_account_change: false, monthly_card_spend_cents: 5000000}

  # c_006, but the linked account is what feeds the new paying account. No income arrives anywhere else.
  - id: c_106
    name: Verde Meal Kits (twin)
    story: >
      Income into the linked account almost stopped. The card is paid from a new account,
      and that account is filled from the linked one before each repayment.
    snapshot:
      bank:
        cash_now_cents: 21800000
        cash_week_ago_cents: 42000000
        linked_accounts: [{id: acct_c106_a, active: true, days_stale: 0}]
      card: {credit_limit_cents: 8000000, utilization_pct: 0.45, last_3_repayments: [paid, paid, paid]}
    signal_window:
      bank_events:
        - {category: income, amount_cents: 500000, counterparty_kind: known_vendor}
        - {category: transfer_own_account, amount_cents: 3000000, counterparty_kind: own_account_other_bank, to_account: acct_external_new_c106}
      card_events:
        - {kind: funding_account_change, from: acct_c106_a, to: acct_external_new_c106}
    baselines:
      bank: {weekly_inflow_cents: 500000, weekly_inflow_typical_cents: 9500000, income_trend: stopped}
      card: {funding_account_change: true, monthly_card_spend_cents: 3000000}

  # c_010, with the fact the team's file leaves out: the failed repayment is still unpaid.
  - id: c_110
    name: Quarry Hill Brewing (unpaid)
    story: >
      Payroll and tax explain the fall. The last repayment failed and has not been paid.
    snapshot:
      bank:
        cash_now_cents: 29000000
        cash_week_ago_cents: 52000000
        linked_accounts: [{id: acct_c110_a, active: true, days_stale: 0}]
      card: {credit_limit_cents: 10000000, utilization_pct: 0.92, last_3_repayments: [paid, paid, failed]}
    signal_window:
      bank_events:
        - {category: payroll, amount_cents: 15000000, counterparty_kind: payroll_vendor}
        - {category: tax, amount_cents: 7000000, counterparty_kind: tax_authority}
      card_events:
        - {kind: failed_repayment, amount_cents: 5000000, still_unpaid: true}
    baselines:
      bank: {weekly_inflow_cents: 8000000, income_trend: steady}
      card: {funding_account_change: false, monthly_card_spend_cents: 9000000, utilization_trend: spiking}

  # c_010, but the failed repayment was paid three days later.
  - id: c_111
    name: Quarry Hill Brewing (paid)
    story: >
      Payroll and tax explain the fall. The last repayment failed and was paid three days later.
    snapshot:
      bank:
        cash_now_cents: 29000000
        cash_week_ago_cents: 52000000
        linked_accounts: [{id: acct_c111_a, active: true, days_stale: 0}]
      card: {credit_limit_cents: 10000000, utilization_pct: 0.92, last_3_repayments: [paid, paid, failed]}
    signal_window:
      bank_events:
        - {category: payroll, amount_cents: 15000000, counterparty_kind: payroll_vendor}
        - {category: tax, amount_cents: 7000000, counterparty_kind: tax_authority}
      card_events:
        - {kind: failed_repayment, amount_cents: 5000000, repaid_after_days: 3}
    baselines:
      bank: {weekly_inflow_cents: 8000000, income_trend: steady}
      card: {funding_account_change: false, monthly_card_spend_cents: 9000000, utilization_trend: spiking}

