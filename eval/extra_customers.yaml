# Customers the evaluation adds to the team's twelve. Same shape as
# data/shared_customers.yaml, which this file does not change. Written before
# any run, with the expected answers in eval/golden_set.yaml.
#
# Six kinds:
#   c_10x, c_11x  one fact changed from a team customer, which changes the answer
#   c_20x         something irrelevant, or a memo, added to a team customer, which must change nothing
#   c_30x, c_31x  a team customer with its ids renamed and nothing else changed. Only the earlier
#                 reviews in eval/history_eval.yaml differ, and they change the answer or must not
#   c_107         c_007's earlier review, with other facts today
#   c_013         a customer of its own, after the team's twelve: cash is steady and only the card side
#                 has trouble, so Card's records alone decide it
#
# Two fields are used here that the team's file does not have:
#   bank_events[].to_account          the account a transfer went to
#   card_events[failed_repayment]     repaid_after_days, or still_unpaid
#
# As in the team's file, bank_events is the whole bank feed of the window: the events a story turns on
# first, then the everyday receipts and running costs, so cash a week ago less cash now is what went out
# less what came in. A twin keeps its team customer's everyday events.

schema_version: 1
clock: {signal_date: "2026-11-10", signal_window_days: 7, trailing_window_weeks: 13}

customers:

