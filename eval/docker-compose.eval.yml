# The evaluation's stack: its own customers for the specialists (and for Bank and Card, which seed them too),
# the seeded reviews of both seed files, and the arm the stack runs (INVESTIGATION_FLOW).
# The embedder comes from the main file, so the evaluation measures the search the main stack runs.
# Used on top of the main file, one fresh stack per arm:
#   INVESTIGATION_FLOW=fixed_rules docker compose -p goldenset -f docker-compose.yml -f eval/docker-compose.eval.yml up -d --build postgres bank card orchestrator
# Compose fills the ${...} values from the shell that starts it, then from the repo-root .env.
# A line in .env for EMBEDDINGS_MODEL changes the embedder here; check "Search:" in summary.md.
services:
  orchestrator:
    environment:
      SHARED_CUSTOMERS_FILE: /data/shared_customers.yaml:/eval/extra_customers.yaml
      # The service seeds both at start. The image holds the first, and the mount below shadows it with the same file.
      HISTORY_SEED_FILE: /eval/history.yaml:/eval/history_eval.yaml
      # Empty is the agent. eval/run.py --arm stops when this names another arm.
      INVESTIGATION_FLOW: ${INVESTIGATION_FLOW:-}
      # Empty is the real specialists, which call Bank and Card; stand_in answers from the data files.
      SPECIALISTS: ${SPECIALISTS:-}
      # The runner signs its analyst's token with JWT_SECRET (app.dev_token), so no Auth0 here, whatever .env says.
      AUTH0_DOMAIN: ""
      AUTH0_AUDIENCE: ""
    volumes:
      - ./eval/extra_customers.yaml:/eval/extra_customers.yaml:ro
      - ./eval/history.yaml:/eval/history.yaml:ro
      - ./eval/history_eval.yaml:/eval/history_eval.yaml:ro
  # Bank and Card seed the evaluation's own customers too, so the real specialists can answer for them.
  bank:
    environment:
      SHARED_CUSTOMERS_YAML: /app/data/shared_customers.yaml:/eval/extra_customers.yaml
    volumes:
      - ./eval/extra_customers.yaml:/eval/extra_customers.yaml:ro
  card:
    environment:
      SHARED_CUSTOMERS_YAML: /app/data/shared_customers.yaml:/eval/extra_customers.yaml
      AUTH0_DOMAIN: ""
      AUTH0_AUDIENCE: ""
    volumes:
      - ./eval/extra_customers.yaml:/eval/extra_customers.yaml:ro
