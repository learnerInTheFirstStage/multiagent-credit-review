# ===================================================================
# shared_customers.yaml
# Single source of truth for the Bank Service + Card Service seeders.
# Owner: Allen (Bank) + James (Card). Any change to a customer's
# story goes HERE first; the services regenerate from this file.
#
# Conventions:
# - All amounts are integer US cents ($100 = 10000 cents),
#   per API doc §1.
# - Dates are ISO 8601 UTC.
# - Enums under `enums:` — both seeders must honor them.
# - snapshot.*  = what both services report at signal_date.
#                 Numbers must match "3. Scenario table" tab 2.
# - signal_window.* = what actually happened in the 7-day window.
#                     bank_events is the bank feed of the window: every
#                     movement of cash, itemised. The events the story
#                     turns on come first (the seeders number events in
#                     file order), then the everyday ones: customer
#                     receipts (income) and running costs (operating),
#                     each with its counterparty's name. Cash a week ago
#                     less cash now is what goes out less what comes in,
#                     except where intended_gap names the gap and why
#                     (c_005, c_012). services/bank/tests/test_customer_files.py
#                     checks it.
# - baselines.*  = context tools need outside the signal window
#                  (trend labels, prior-year data, payee history), and
#                  what the Bank seeder generates the earlier weeks from:
#                  weekly inflows, and weekly_operating_outflow_cents,
#                  the running costs of a usual week.
# - data_integrity (at bottom) = flags that need special seeder
#   behavior beyond what the per-customer fields above express.
# ===================================================================

schema_version: 1

clock:
  signal_date: "2026-11-10"        # the "today" of the generated dataset
  signal_window_days: 7            # the "cash fell in 7 days" window
  trailing_window_weeks: 13        # for the income_trend tool

enums:
  transaction_category:
    [payroll, tax, vendor_known, vendor_new,
     transfer_own_account, transfer_other, income, other,
     operating]   # operating: a running cost to a payee paid every week (rent, suppliers, software, utilities, fees)
  counterparty_kind:
    [payroll_vendor, tax_authority, known_vendor,
     unknown_payee, own_account_other_bank]
  repayment_state: [paid, late, failed]
  income_trend:    [steady, shrinking, stopped, too_short_to_tell]
  clue_side:       [bank, card, both]

