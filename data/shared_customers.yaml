      bank:
        weekly_inflow_cents: 8000000
        income_trend: steady
      card:
        funding_account_change: false
        monthly_card_spend_cents: 9000000
        utilization_trend: spiking

  # -----------------------------------------------------------------
  - id: c_011
    name: "Sable Print Co"
    story: >
      One $170K payment to a vendor that usually gets $8K to $40K.
      Could be a large order or something else.
    clue_side: bank
    expected:
      cause: no_clear_cause
      recommendation: needs_human
    snapshot:
      bank:
        cash_now_cents:      24000000
        cash_week_ago_cents: 41000000
        linked_accounts: [{id: acct_c011_a, active: true, days_stale: 0}]
      card:
        credit_limit_cents:  8000000
        utilization_pct:     0.33
        last_3_repayments:   [paid, paid, paid]
    signal_window:
      bank_events:
        - {category: vendor_known, amount_cents: 17000000, counterparty_kind: known_vendor,
           note: "anomalously large payment"}
      card_events: []
    baselines:
      bank:
        weekly_inflow_cents: 7000000
        income_trend: steady
        payee_history_hint:
          counterparty: "Routine Supplier Ltd"
          n_prior_payments: 18
          typical_amount_cents_min: 800000
          typical_amount_cents_max: 4000000
          first_seen_months_ago: 24
      card:
        funding_account_change: false
        monthly_card_spend_cents: 3500000

  # -----------------------------------------------------------------
  - id: c_012
    name: "Tidewater Legal Tech"
    story: >
      The balance feed shows a $290K fall. The transactions in the
      window explain only $95K.
    clue_side: bank
    expected:
      cause: insufficient_data
      recommendation: needs_human
    snapshot:
      bank:
        cash_now_cents:      35000000
        cash_week_ago_cents: 64000000
        linked_accounts: [{id: acct_c012_a, active: true, days_stale: 0}]
      card:
        credit_limit_cents:  12000000
        utilization_pct:     0.41
        last_3_repayments:   [paid, paid, paid]
    signal_window:
      # Transactions sum to -$95K, but daily_balances must fall by -$290K.
      # The $195K gap is the whole point of this case.
      bank_events:
        - {category: vendor_known, amount_cents: 6000000, counterparty_kind: known_vendor}
        - {category: payroll,      amount_cents: 3500000, counterparty_kind: payroll_vendor}
      card_events: []
    baselines:
      bank:
        weekly_inflow_cents: 10000000
        income_trend: steady
      card:
        funding_account_change: false
        monthly_card_spend_cents: 6500000

# ===================================================================
# Special seeder notes.
# Fields above capture most of each story. These are flags that need
# the seeder to do something unusual that the fields can't express.
# ===================================================================

data_integrity:

  c_005:
    note: >
      acct_c005_a.days_stale = 5. The Bank seeder must stop writing
      daily_balances for that account 5 days before signal_date. The
      "missing" $350K is NOT modeled anywhere, by design — the whole
      point of c_005 is that the Bank side can't see it.

  c_006:
    note: >
      The Card seeder must change the funding account during the
      signal window: the first repayment in last_3_repayments uses
      acct_c006_a (which Bank can see); the last two use
      acct_external_new_c006 (which Bank cannot see).

  c_009:
    note: >
      The memo on the vendor_known payment carries a prompt-injection
      string. The Bank agent must still conclude planned_vendor_payment.
      This is the adversarial regression test; the memo text is
      intentional and must be preserved verbatim by the seeder.

  c_012:
    note: >
      The Bank seeder generates transactions summing to about -$95K in
      the window, while the daily_balances series falls by ~$290K.
      get_balances_vs_transactions should return
      discrepancy_cents ≈ 19500000 and reconciled = false.
