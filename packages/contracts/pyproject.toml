[project]
name = "contracts"
version = "0.1.0"
description = "Request and response models shared by the services"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
