# Runs on every pull request and on main: the three services' test suites, the frontend build and the deploy
# scripts' checks. The tests need Python 3.12 and nothing else: no Docker, no database server, no model, no network.
# The steps are the ones in the README under "Run the tests".
name: Tests

on:
  pull_request:
  push:
    branches: [main]

# On a pull request a newer push cancels the run before it. On main every commit keeps its result.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One service failing does not stop the other two.
      fail-fast: false
      matrix:
        service: [orchestrator, bank, card]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt ../../packages/contracts
      - name: Test
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      # Type check and bundle. The frontend has no tests yet.
      - name: Build
        run: npm run build

  deploy-scripts:
    name: deploy scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Stand-in aws, kubectl and docker first on PATH: no account, cluster or build is touched.
      # Every check runs, and the job fails if any of them did.
      - name: Test
        run: |
          status=0
          for t in k8s/up-test.sh k8s/aws/teardown-test.sh k8s/aws/push-images-test.sh; do
            echo "== $t"
            bash "$t" || status=1
          done
          exit "$status"
