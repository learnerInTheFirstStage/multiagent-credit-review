# Claude answers when someone with write access mentions @claude on a pull request.
# Review only: no automatic review, and Claude may not commit or push.
# Auth: a Claude subscription token in the repository secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`).
# Based on anthropics/claude-code-action examples/claude.yml.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Pull requests only: an issue_comment counts only when the issue is a pull request.
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One run per pull request at a time.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # A cap on each run, and no commits or pushes (the action documents deny rules here as the way to block them).
          claude_args: |
            --max-turns 15
            --disallowedTools "Bash(git add:*),Bash(git rm:*),Bash(git commit:*),Bash(git push:*)"
