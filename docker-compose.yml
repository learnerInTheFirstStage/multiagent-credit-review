name: credit-review

# Only the gateway is reachable from outside (port 8080).
# The 127.0.0.1 ports are for local development and are not exposed on a server.
# Passwords fall back to local defaults. On a server, set real ones in a .env file.
# Every service built here has pull_policy: build: `docker compose up` rebuilds it from this checkout each time (quick
# when nothing changed), so no container keeps an image from before a pull.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-local-auth}
      BANK_DB_PASSWORD: ${BANK_DB_PASSWORD:-local-bank}
      CARD_DB_PASSWORD: ${CARD_DB_PASSWORD:-local-card}
      ORCHESTRATOR_DB_PASSWORD: ${ORCHESTRATOR_DB_PASSWORD:-local-orchestrator}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP check: during first-run init Postgres listens on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 12

  auth:
    pull_policy: build
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://auth:${AUTH_DB_PASSWORD:-local-auth}@postgres:5432/auth
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"

  bank:
    pull_policy: build
    build:
      context: .
      dockerfile: services/bank/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://bank:${BANK_DB_PASSWORD:-local-bank}@postgres:5432/bank
      JWT_SECRET: ${JWT_SECRET:-local-jwt-secret-for-development-only}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      # The image has no curl. /health answers once seeding is done, and is a 500 when the database is not there.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  card:
    pull_policy: build
    build:
      context: .
      dockerfile: services/card/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://card:${CARD_DB_PASSWORD:-local-card}@postgres:5432/card
      JWT_SECRET: ${JWT_SECRET:-local-jwt-secret-for-development-only}
      # Empty: people's tokens are HS256 too (services/auth/README.md).
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8003:8000"
    healthcheck:
      # As bank's.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  orchestrator:
    pull_policy: build
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
      # The fastembed model for the investigator's search, fetched from huggingface.co at build time.
      # Offline: set WITH_EMBEDDINGS=0 and EMBEDDINGS_MODEL=hash:384 together, or the search tool is not offered.
      args:
        WITH_EMBEDDINGS: ${WITH_EMBEDDINGS:-1}
    environment:
      DATABASE_URL: postgresql+psycopg://orchestrator:${ORCHESTRATOR_DB_PASSWORD:-local-orchestrator}@postgres:5432/orchestrator
      JWT_SECRET: ${JWT_SECRET:-local-jwt-secret-for-development-only}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
      BANK_URL: http://bank:8000
      CARD_URL: http://card:8000
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_STRUCTURED_OUTPUT: ${LLM_STRUCTURED_OUTPUT:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      SPECIALISTS: ${SPECIALISTS:-}
      # The same embedder here and in the evaluation, so the demo runs the search the evaluation measured.
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-fastembed:BAAI/bge-small-en-v1.5}
      # Enables POST /dev_login for the demo frontend, until the real Auth Service lands.
      # Default is OFF: anyone who can reach the gateway could otherwise mint a service
      # or analyst token with this endpoint. Set DEV_LOGIN=1 in your local .env to use
      # the demo login page. Never set it on a host that reaches the internet.
      DEV_LOGIN: ${DEV_LOGIN:-}
      # KAN-74 (bonus): when set, the API publishes case_ids to RabbitMQ and the worker
      # service (started by the `mq` profile below) runs them. Empty leaves the default
      # in-process FastAPI BackgroundTasks path.
      RABBITMQ_URL: ${RABBITMQ_URL:-}
      # The monthly report (services/orchestrator/app/reports.py): kept in this S3 bucket when set, else in the
      # reports volume. S3 credentials come from the instance role on AWS, never from .env.
      REPORTS_BUCKET: ${REPORTS_BUCKET:-}
      REPORTS_DIR: /reports
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - reports:/reports
    depends_on:
      postgres:
        condition: service_healthy
      # The real specialists call both. A Bank or Card that does not start stops `up` here, instead of
      # every case reading bank_unreachable.
      bank:
        condition: service_healthy
      card:
        condition: service_healthy
    ports:
      - "127.0.0.1:8004:8000"

  # KAN-74 (bonus): RabbitMQ broker + a worker that consumes case_ids. Both sit behind
  # the `mq` compose profile so `docker compose up` stays on the in-process path by
  # default. Start the async stack with `docker compose --profile mq up -d`.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    profiles: [mq]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-credit-review}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-local-rabbit}
    ports:
      # Management UI (http://localhost:15672) kept on 127.0.0.1 only.
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    pull_policy: build
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
      args:
        WITH_EMBEDDINGS: ${WITH_EMBEDDINGS:-1}
    profiles: [mq]
    command: ["python", "-m", "app.mq.worker"]
    # A real case takes 60–180 s inside the pika callback. Docker's default
    # SIGTERM-to-SIGKILL gap is 10 s, which would kill a case mid-run; the
    # broker would redeliver it after noticing the dead connection. 10 min
    # is a comfortable upper bound for any one case.
    stop_grace_period: 10m
    environment:
      DATABASE_URL: postgresql+psycopg://orchestrator:${ORCHESTRATOR_DB_PASSWORD:-local-orchestrator}@postgres:5432/orchestrator
      JWT_SECRET: ${JWT_SECRET:-local-jwt-secret-for-development-only}
      BANK_URL: http://bank:8000
      CARD_URL: http://card:8000
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_STRUCTURED_OUTPUT: ${LLM_STRUCTURED_OUTPUT:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      SPECIALISTS: ${SPECIALISTS:-}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-fastembed:BAAI/bge-small-en-v1.5}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-credit-review}:${RABBITMQ_PASSWORD:-local-rabbit}@rabbitmq:5672/
      # Pipe-validation mode: the worker sleeps instead of running the graph so no LLM is called.
      MOCK_PROCESSING: ${MOCK_PROCESSING:-}
      MOCK_SECONDS: ${MOCK_SECONDS:-150}
    depends_on:
      postgres:
        condition: service_healthy
      bank:
        condition: service_healthy
      card:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    pull_policy: build
    build:
      context: ./frontend
      # The same .env values the Orchestrator and Card check tokens with. Empty: the dev login page.
      args:
        VITE_AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
        VITE_AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
        VITE_AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}

  gateway:
    pull_policy: build
    build: ./gateway
    depends_on:
      - auth
      - orchestrator
      - frontend
    ports:
      - "8080:80"

volumes:
  pgdata:
  reports:
