# The access log writes the path without its query string: the SSE stream sends the access token as ?token=.
# $uri would give the path after the rewrites below, so the query is cut from $request_uri instead.
# No Referer either: after sign-in it is /login?code=...&state=... The error log's format is fixed and quotes the
# whole request line, so the stream's location below logs critical errors only.
# Each line ends with the request ID, so it can be found in the services' logs.
map $request_uri $path_only {
    ~^(?<path>[^?]*) $path;
}

log_format no_query '$remote_addr - $remote_user [$time_local] "$request_method $path_only $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent" "$http_x_forwarded_for" request_id=$request_id';

server {
    listen 80;
    access_log /var/log/nginx/access.log no_query;

    # Docker's DNS. Names are looked up per request (through the variables
    # below), so the gateway keeps working when a service container is
    # recreated, and still starts when one of them is down.
    resolver 127.0.0.11 valid=10s;

    # Every request gets an ID the services can log. The browser gets it back, errors included, so the
    # frontend can log it with a failed call and that call can be found in the services' logs.
    proxy_set_header X-Request-ID $request_id;
    # A location with an add_header or proxy_set_header of its own drops these: repeat them there.
    add_header X-Request-ID $request_id always;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Only Auth and the Orchestrator are reachable from outside.
    # The Bank and Card services are called by the Orchestrator only.
    location /api/auth/ {
        set $upstream http://auth:8000;
        rewrite ^/api/auth/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /api/orchestrator/ {
        set $upstream http://orchestrator:8000;
        rewrite ^/api/orchestrator/(.*)$ /$1 break;
        proxy_pass $upstream;

        # The orchestrator's /cases/events endpoint streams server-sent events.
        # For the stream to actually stream instead of being held until close,
        # nginx needs HTTP/1.1, no buffering, and a long read timeout. These
        # settings are safe for the regular JSON endpoints too.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Repeated from the server block: the line above stops this location from inheriting them.
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;

        # The stream carries the token in its query. An Orchestrator that is down or restarts would otherwise
        # write that query to the error log once per open tab; its access line still has the status and the ID.
        location = /api/orchestrator/cases/events {
            error_log /var/log/nginx/error.log crit;
            set $upstream http://orchestrator:8000;
            rewrite ^/api/orchestrator/(.*)$ /$1 break;
            proxy_pass $upstream;
        }
    }

    location / {
        set $upstream http://frontend:80;
        proxy_pass $upstream;
    }
}
