# The Kubernetes copy of gateway/nginx.conf. Keep the routes the same as there.
#
# The one difference: gateway/nginx.conf looks names up per request through Docker's DNS (127.0.0.11), which
# Kubernetes does not have. Here the names are looked up once, at start. That is safe in Kubernetes, because a
# Service keeps its address while its pods come and go.
server {
    listen 80;

    # Every request gets an ID the services can log. The browser gets it back, errors included, so the
    # frontend can log it with a failed call and that call can be found in the services' logs.
    proxy_set_header X-Request-ID $request_id;
    # A location with an add_header or proxy_set_header of its own drops these: repeat them there.
    add_header X-Request-ID $request_id always;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Only Auth and the Orchestrator are reachable from outside.
    # The Bank and Card services are called by the Orchestrator only.
    location /api/auth/ {
        proxy_pass http://auth:8000/;
    }

    location /api/orchestrator/ {
        proxy_pass http://orchestrator:8000/;

        # The orchestrator's /cases/events endpoint streams server-sent events.
        # For the stream to actually stream instead of being held until close,
        # nginx needs HTTP/1.1, no buffering, and a long read timeout. These
        # settings are safe for the regular JSON endpoints too.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://frontend:80;
    }
}
