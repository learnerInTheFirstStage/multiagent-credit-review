# The whole system on Kubernetes (KAN-75). Same services, images and settings as docker-compose.yml, which stays
# the way to run it day to day. Applied through an overlay: kubectl apply -k k8s/overlays/local
#
# Made outside this folder by k8s/up.sh, never committed:
#   Secret credit-review     passwords, the JWT secret and the model key, from the repo-root .env
#   ConfigMap postgres-init  infra/postgres/init/, the same script compose mounts
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: credit-review

resources:
  - namespace.yaml
  - postgres.yaml
  - rabbitmq.yaml
  - auth.yaml
  - bank.yaml
  - card.yaml
  - orchestrator.yaml
  - worker.yaml
  - frontend.yaml
  - gateway.yaml

configMapGenerator:
  # The settings that are not secret, with compose's defaults. An overlay changes them.
  - name: settings
    literals:
      - SPECIALISTS=
      - EMBEDDINGS_MODEL=fastembed:BAAI/bge-small-en-v1.5
      - AUTH0_DOMAIN=
      - AUTH0_AUDIENCE=
      - DEV_LOGIN=
      - REPORTS_BUCKET=
      - AWS_DEFAULT_REGION=us-east-1
      - MOCK_PROCESSING=
      - MOCK_SECONDS=150
  # The gateway's routes, for Kubernetes: gateway/nginx.conf looks names up through Docker's DNS.
  - name: gateway
    files:
      - default.conf=gateway.conf

labels:
  - pairs:
      app.kubernetes.io/part-of: credit-review
