# Exactly one copy, never two at once, even during a deploy (strategy Recreate). It owns what must run once:
# - the retry loop for cases waiting on Bank or Card;
# - the monthly report loop (KAN-73);
# - the pickup of unfinished cases at start (app/runner.py: "One process is assumed").
# New cases go to RabbitMQ and run on the workers (worker.yaml), which are the part that scales.
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
spec:
  selector:
    app: orchestrator
  ports:
    - port: 8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: reports
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      initContainers:
        # compose's depends_on: Postgres, and Bank and Card healthy. A Bank or Card that is not up would make
        # every case read bank_unreachable.
        - name: wait-for-dependencies
          image: credit-review-orchestrator
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              import socket, time, urllib.request
              def up(check):
                  try:
                      check()
                      return True
                  except Exception:
                      return False
              checks = {
                  "postgres": lambda: socket.create_connection(("postgres", 5432), 2).close(),
                  "rabbitmq": lambda: socket.create_connection(("rabbitmq", 5672), 2).close(),
                  "bank": lambda: urllib.request.urlopen("http://bank:8000/health", timeout=2),
                  "card": lambda: urllib.request.urlopen("http://card:8000/health", timeout=2),
              }
              while waiting := [name for name, check in checks.items() if not up(check)]:
                  print("waiting for", ", ".join(waiting), flush=True)
                  time.sleep(3)
      containers:
        - name: orchestrator
          image: credit-review-orchestrator
          imagePullPolicy: IfNotPresent
          env:
            - {name: ORCHESTRATOR_DB_PASSWORD, valueFrom: {secretKeyRef: {name: credit-review, key: ORCHESTRATOR_DB_PASSWORD}}}
            - name: DATABASE_URL
              value: postgresql+psycopg://orchestrator:$(ORCHESTRATOR_DB_PASSWORD)@postgres:5432/orchestrator
            - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: credit-review, key: JWT_SECRET}}}
            - {name: AUTH0_DOMAIN, valueFrom: {configMapKeyRef: {name: auth0, key: AUTH0_DOMAIN}}}
            - {name: AUTH0_AUDIENCE, valueFrom: {configMapKeyRef: {name: auth0, key: AUTH0_AUDIENCE}}}
            - {name: BANK_URL, value: "http://bank:8000"}
            - {name: CARD_URL, value: "http://card:8000"}
            - {name: LLM_MODEL, valueFrom: {secretKeyRef: {name: credit-review, key: LLM_MODEL}}}
            - {name: LLM_API_KEY, valueFrom: {secretKeyRef: {name: credit-review, key: LLM_API_KEY}}}
            - {name: LLM_STRUCTURED_OUTPUT, valueFrom: {secretKeyRef: {name: credit-review, key: LLM_STRUCTURED_OUTPUT}}}
            - {name: LANGFUSE_PUBLIC_KEY, valueFrom: {secretKeyRef: {name: credit-review, key: LANGFUSE_PUBLIC_KEY}}}
            - {name: LANGFUSE_SECRET_KEY, valueFrom: {secretKeyRef: {name: credit-review, key: LANGFUSE_SECRET_KEY}}}
            - {name: LANGFUSE_BASE_URL, valueFrom: {secretKeyRef: {name: credit-review, key: LANGFUSE_BASE_URL}}}
            - {name: SPECIALISTS, valueFrom: {configMapKeyRef: {name: settings, key: SPECIALISTS}}}
            - {name: EMBEDDINGS_MODEL, valueFrom: {configMapKeyRef: {name: settings, key: EMBEDDINGS_MODEL}}}
            - {name: DEV_LOGIN, valueFrom: {configMapKeyRef: {name: settings, key: DEV_LOGIN}}}
            - {name: RABBITMQ_USER, valueFrom: {secretKeyRef: {name: credit-review, key: RABBITMQ_USER}}}
            - {name: RABBITMQ_PASSWORD, valueFrom: {secretKeyRef: {name: credit-review, key: RABBITMQ_PASSWORD}}}
            # Set, so new cases go to the queue and the workers run them (KAN-74).
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672/
            # The monthly report (KAN-73): in S3 when REPORTS_BUCKET is set, else on the reports volume.
            - {name: REPORTS_BUCKET, valueFrom: {configMapKeyRef: {name: settings, key: REPORTS_BUCKET}}}
            - {name: REPORTS_DIR, value: /reports}
            - {name: AWS_DEFAULT_REGION, valueFrom: {configMapKeyRef: {name: settings, key: AWS_DEFAULT_REGION}}}
          ports:
            - containerPort: 8000
          # Loading the search model and the seeded reviews takes a while on first start.
          startupProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 1536Mi}
          volumeMounts:
            - {name: reports, mountPath: /reports}
      volumes:
        - name: reports
          persistentVolumeClaim:
            claimName: reports
